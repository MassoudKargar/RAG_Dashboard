name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  quality:
    name: Lint · Typecheck · Unit · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci

      - name: Typecheck
        run: |
          npm --prefix backend run typecheck
          npm --prefix frontend run typecheck

      - name: Unit tests (frontend)
        run: npm --prefix frontend run test:unit

      - name: Backend tests
        run: npm --prefix backend run test:unit

      - name: Build
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build

  e2e:
    name: Browser tests (demo mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - name: Install
        run: |
          npm --prefix backend ci
          npm --prefix frontend ci
          npm --prefix tests ci
      - name: Build backend + frontend
        run: |
          npm --prefix backend run build
          npm --prefix frontend run build
      - name: Install Chromium
        working-directory: tests
        run: npx playwright install chromium --with-deps
      - name: Run browser tests (benchmark view, demo mode — no live RAG required)
        working-directory: tests
        env:
          CI: "1"
        run: npx playwright test --project=desktop

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t rag-dashboard:ci .
      - name: Smoke health
        run: |
          docker run --rm -d -p 127.0.0.1:4173:4173 \
            -e DASHBOARD_HOST=0.0.0.0 -e ENABLE_DEMO_MODE=true \
            --name rdash-ci rag-dashboard:ci
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/api/health || true)
            [ "$code" = "200" ] && break
            sleep 2
          done
          curl -sf http://127.0.0.1:4173/api/health
          docker rm -f rdash-ci >/dev/null

  secret-scan:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}